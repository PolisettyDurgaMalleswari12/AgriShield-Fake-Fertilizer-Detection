{% extends "base.html" %}{% block content %}<main class="card"><h1 data-i18n="verifyTitle">🔍 Product Verification</h1><div class="scanner"><h2>📷 <span data-i18n="camera">Camera Barcode / QR Scanner</span></h2><p data-i18n="cameraHelp">Allow camera access. Scan the product code; the Product ID will be filled automatically.</p><div id="reader"></div><p id="scanStatus"></p></div><form method="post" action="/verify"><label data-i18n="productId">Product ID</label><input id="product_id" name="product_id" value="{{product_id}}" placeholder="Filled after scan" required><label data-i18n="batch">Batch Number</label><input name="batch_number" required><label data-i18n="mrp">MRP</label><input name="mrp" type="number" step="0.01" required><button data-i18n="verifyBtn">Verify Product</button></form><p class="hint">Demo code values: <b>F001</b>, <b>F002</b>, <b>F006</b>, <b>F008</b></p></main><script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script><script src="{{url_for('static',filename='scanner.js')}}"></script>{% endblock %}
