{% extends "base.html" %}{% block content %}<main class="tablecard"><h1>📋 Verification History</h1><table><tr><th>Product</th><th>Brand</th><th>Batch</th><th>MRP</th><th>Risk</th><th>Result</th><th>Date</th></tr>{% for x in history %}<tr><td>{{x["product_name"]}}</td><td>{{x["brand"]}}</td><td>{{x["batch_number"]}}</td><td>₹{{x["mrp"]}}</td><td>{{x["risk"]}}%</td><td>{{x["result"]}}</td><td>{{x["created_at"]}}</td></tr>{% else %}<tr><td colspan="7">No history.</td></tr>{% endfor %}</table></main>{% endblock %}
